name: Windows build and localization checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run classification tests
        run: dotnet run --project tests/ClassifierTests/ClassifierTests.csproj --configuration Release
      - name: Check locale catalogs
        run: dotnet run --project tests/LocalizationTests/LocalizationTests.csproj --configuration Release
      - name: Build WPF portable executable
        run: dotnet publish src/CoolifyDeployManager/CoolifyDeployManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o portable
      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path 'portable/CoolifyDeployManager.exe')) { throw 'Missing executable.' }
          Get-FileHash 'portable/CoolifyDeployManager.exe' -Algorithm SHA256
